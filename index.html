<!DOCTYPE html>
<html lang="en" data-theme="light" data-style="folio" data-font="sans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Notes — Minimalist PWA</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Outfit:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/main.css" />
  <script>
    (function(){try{var d=document.documentElement,s=localStorage.getItem('notes_theme_style'),t=localStorage.getItem('notes_theme'),f=localStorage.getItem('notes_font');if(s)d.setAttribute('data-style',s);if(t){d.setAttribute('data-theme',t);}else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){d.setAttribute('data-theme','dark');}if(f)d.setAttribute('data-font',f);}catch(e){}})();
  </script>
</head>
<body data-view="split">
  <script>(function(){try{var v=localStorage.getItem('notes_view_mode');if(v)document.body.setAttribute('data-view',v);}catch(e){}})();</script>
  <div id="app">
    <div class="app-main">
      <button id="sidebar-toggle" class="icon-btn-sm persistent-sidebar-toggle" title="Toggle Sidebar" aria-label="Toggle Sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
      
      <!-- Full-Height Sidebar Column -->
      <aside id="sidebar" class="sidebar">
        <script>try{if(localStorage.getItem('notes_sidebar_open')!=='true'){document.getElementById('sidebar').classList.add('is-collapsed');}}catch(e){}</script>
        <div class="sidebar-header">
          <div class="brand-section">
            <div class="brand-logo-badge">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
            </div>
            <span class="brand-title">Notes</span>
          </div>
        </div>

        <div class="sidebar-controls">
          <div class="search-wrapper">
            <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="search" id="search-input" class="search-input" placeholder="Search... (Ctrl+K)" autocomplete="off" />
          </div>
          <div style="position:relative;">
            <button id="btn-sort-menu" class="icon-btn-sm" title="Sort Notes" aria-label="Sort Notes"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M6 12h12M10 18h4"/></svg></button>
            <div id="sort-dropdown" class="dropdown-menu sort-menu">
              <button class="dropdown-item" data-sort="updated_desc"><span>Recently Updated</span></button><button class="dropdown-item" data-sort="updated_asc"><span>Oldest Updated</span></button><button class="dropdown-item" data-sort="created_desc"><span>Newest Created</span></button><button class="dropdown-item" data-sort="title_asc"><span>Title (A-Z)</span></button><button class="dropdown-item" data-sort="title_desc"><span>Title (Z-A)</span></button>
            </div>
          </div>
        </div>

        <div id="tags-bar" class="tags-bar"></div>

        <div id="trash-banner" class="trash-banner" style="display:none;">
          <span>Viewing Trash</span>
          <button id="empty-trash-btn" class="btn-empty-trash">Empty</button>
        </div>

        <div id="notes-list" class="notes-list-container"></div>

        <div class="sidebar-footer">
          <button id="trash-toggle-btn" class="trash-toggle-btn" title="View Trash">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            <span>Trash</span>
          </button>
          <div style="display:flex; align-items:center; gap:2px;">
            <button id="export-backup-btn" class="icon-btn-sm" title="Backup JSON" aria-label="Backup JSON"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></button>
            <label id="import-backup-label" class="icon-btn-sm" title="Restore JSON" aria-label="Restore JSON" style="cursor:pointer;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg><input type="file" id="import-backup-input" accept=".json" class="sr-only" /></label>
          </div>
        </div>
      </aside>

      <!-- Main Workspace -->
      <main class="workspace">
        <button id="exit-zen-btn" class="exit-zen-btn" title="Exit Focus (Esc)">Exit Focus</button>

        <!-- Workspace Header Bar -->
        <header class="workspace-header">
          <div class="header-left">
            <button id="new-note-btn" class="btn-new-header" title="New Note (Ctrl+N)" aria-label="New Note">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <span>New</span>
            </button>
            <div class="save-status-group">
              <span id="status-dot" class="status-dot"></span>
              <span id="save-status">Saved</span>
            </div>
          </div>

          <div class="header-right">
            <button id="btn-font-cycle" class="icon-btn-sm" style="font-weight:700; font-size:0.78rem;" title="Switch Font (Sans/Serif/Mono)">Aa</button>
            <div style="position:relative;">
              <button id="btn-export-menu" class="icon-btn-sm" title="Export Note (PDF, Markdown, HTML, Text)" aria-label="Export Note">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              </button>
              <div id="export-dropdown" class="dropdown-menu">
                <button id="action-export-pdf" class="dropdown-item"><span>Multipage PDF</span><span style="font-size:0.7rem; color:var(--text-muted);">.pdf</span></button><button id="action-export-md" class="dropdown-item"><span>Markdown File</span><span style="font-size:0.7rem; color:var(--text-muted);">.md</span></button><button id="action-export-html" class="dropdown-item"><span>HTML Document</span><span style="font-size:0.7rem; color:var(--text-muted);">.html</span></button><button id="action-export-txt" class="dropdown-item"><span>Plain Text</span><span style="font-size:0.7rem; color:var(--text-muted);">.txt</span></button><button id="action-copy" class="dropdown-item"><span>Copy to Clipboard</span><span style="font-size:0.7rem; color:var(--text-muted);">Copy</span></button>
              </div>
            </div>
            <div style="position:relative;">
              <button id="btn-style-menu" class="icon-btn-sm" title="Change Theme Style (Studio, Folio, Mac 1984)" aria-label="Change Theme Style"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.563-2.512 5.563-5.563C21.999 6.5 17.5 2 12 2z"/></svg></button>
              <div id="style-dropdown" class="dropdown-menu style-menu">
                <button class="dropdown-item" data-style-choice="folio"><div style="display:flex;align-items:center;gap:6px;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#0f6e56;"></span><span>Folio</span></div><span class="case-hint">Default</span></button><button class="dropdown-item" data-style-choice="resin"><div style="display:flex;align-items:center;gap:6px;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#0284c7;"></span><span>Resin</span></div><span class="case-hint">Glass</span></button><button class="dropdown-item" data-style-choice="longhorn"><div style="display:flex;align-items:center;gap:6px;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#1a7fb8;"></span><span>Longhorn</span></div><span class="case-hint">Vista</span></button><button class="dropdown-item" data-style-choice="studio"><div style="display:flex;align-items:center;gap:6px;"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#4f46e5;"></span><span>Studio</span></div><span class="case-hint">Modern</span></button><button class="dropdown-item" data-style-choice="mac1984"><div style="display:flex;align-items:center;gap:6px;"><span style="display:inline-block;width:8px;height:8px;border:1px solid currentColor;background:transparent;"></span><span>Mac 1984</span></div><span class="case-hint">Retro</span></button>
              </div>
            </div>
            <button id="theme-toggle" class="icon-btn-sm" title="Toggle Theme" aria-label="Toggle Theme">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
          </div>
        </header>

        <!-- Formatting Toolbar -->
        <div id="toolbar" class="toolbar">
          <div class="toolbar-group">
            <button class="toolbar-btn" data-cmd="h1" title="Heading 1"><strong>H1</strong></button><button class="toolbar-btn" data-cmd="h2" title="Heading 2"><strong>H2</strong></button><button class="toolbar-btn" data-cmd="h3" title="Heading 3"><strong>H3</strong></button>
            <div class="divider"></div>
            <button class="toolbar-btn" data-cmd="bold" title="Bold (Ctrl+B)"><strong>B</strong></button><button class="toolbar-btn" data-cmd="italic" title="Italic (Ctrl+I)"><em>I</em></button><button class="toolbar-btn" data-cmd="code" title="Code">&lt;&gt;</button>
            <div class="case-dropdown-wrapper">
              <button id="btn-case-menu" class="toolbar-btn" title="Change Case (UPPER, lower, Title, camel, etc.)" style="font-weight:600; font-size:0.8rem;">aA ▾</button>
              <div id="case-dropdown" class="dropdown-menu case-menu">
                <button class="dropdown-item" data-case="upper"><span>UPPERCASE</span><span class="case-hint">ABC</span></button><button class="dropdown-item" data-case="lower"><span>lowercase</span><span class="case-hint">abc</span></button><button class="dropdown-item" data-case="title"><span>Title Case</span><span class="case-hint">Abc Def</span></button><button class="dropdown-item" data-case="sentence"><span>Sentence case</span><span class="case-hint">Abc def</span></button><button class="dropdown-item" data-case="camel"><span>camelCase</span><span class="case-hint">abcDef</span></button><button class="dropdown-item" data-case="pascal"><span>PascalCase</span><span class="case-hint">AbcDef</span></button><button class="dropdown-item" data-case="snake"><span>snake_case</span><span class="case-hint">abc_def</span></button><button class="dropdown-item" data-case="kebab"><span>kebab-case</span><span class="case-hint">abc-def</span></button>
              </div>
            </div>
            <div class="divider"></div>
            <button class="toolbar-btn" data-cmd="task" title="Checklist Item">☑</button><button class="toolbar-btn" data-cmd="list" title="Bullet List">•</button><button class="toolbar-btn" data-cmd="ordered-list" title="Numbered List">1.</button><button class="toolbar-btn" data-cmd="quote" title="Quote">“</button>
            <div class="divider"></div>
            <button class="toolbar-btn btn-pagebreak" data-cmd="pagebreak" title="Insert Page Break for PDF Export">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h3m3 0h6m3 0h3M6 5h12a1 1 0 011 1v3H5V6a1 1 0 011-1zm0 14h12a1 1 0 001-1v-3H5v3a1 1 0 001 1z"/></svg>
              <span>Page Break</span>
            </button>
          </div>

          <div class="toolbar-group">
            <div class="segmented-control" aria-label="View Mode">
              <button class="segmented-btn" data-cmd="view-edit" title="Editor Only">Edit</button>
              <button class="segmented-btn is-active" data-cmd="view-split" title="Split View">Split</button>
              <button class="segmented-btn" data-cmd="view-preview" title="Preview Only">Preview</button>
            </div>
            <div class="divider"></div>
            <div class="segmented-control" aria-label="Format Mode">
              <button data-format="plain" class="segmented-btn" title="Plain Text">Plain</button>
              <button data-format="markdown" class="segmented-btn is-active" title="Markdown">MD</button>
              <button data-format="html" class="segmented-btn" title="HTML">HTML</button>
            </div>
            <div class="divider"></div>
            <button class="toolbar-btn" data-cmd="toggle-zen" title="Focus Mode (Ctrl+Shift+F)">Zen</button>
          </div>
        </div>

        <!-- Content Area -->
        <div class="content-pane">
          <div id="editor-wrapper" class="editor-wrapper">
            <div class="canvas-inner">
              <div class="editor-title-container"><input type="text" id="note-title" class="note-title-input" placeholder="Untitled Note" autocomplete="off" /><input type="text" id="note-desc" class="note-desc-input" placeholder="Add a description or summary..." autocomplete="off" /></div>
              <textarea id="note-body" class="note-body-textarea" placeholder="Start writing here... (Markdown, HTML, or Plain Text)"></textarea>
            </div>
          </div>

          <div id="preview-wrapper" class="preview-wrapper">
            <div class="canvas-inner"><div id="preview-content" class="preview-content"></div></div>
          </div>
        </div>

        <!-- Status Bar -->
        <footer class="status-bar">
          <div class="status-left"><span id="reading-time">0 min read</span><span id="word-count">0 words</span><span id="char-count">0 chars</span></div>
          <div class="status-right"><span>Offline Ready</span></div>
        </footer>
      </main>
    </div>

    <!-- Modals & Toasts -->
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-container"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
